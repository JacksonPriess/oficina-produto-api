name: CI/CD Pipeline - Catálogo de Produtos

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalogo-produto-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: oficina-produto-dev-repo
  EKS_CLUSTER_NAME: oficina-api-dev-cluster
  K8S_NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CI
      # ============================================================

      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validar configuração de deploy
        run: |
          python3 -m pip install -r scripts/requirements-deploy.txt
          python3 -m unittest discover -s tests/deploy -v

      - name: Executar testes, empacotar aplicação e análise SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Descomente apenas se NÃO estiver usando o SonarCloud
        run: mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-oficina-produto-api
          path: target/site/jacoco/
          if-no-files-found: warn

      # ============================================================
      # CD
      # ============================================================

      - name: Configurar credenciais AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar no Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagem no Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKER_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Gerando imagem: $DOCKER_IMAGE"

          docker build -t "$DOCKER_IMAGE" .
          docker push "$DOCKER_IMAGE"

      - name: Configurar acesso ao EKS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      - name: Implantar no Amazon EKS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          OPENAPI_SERVER_URL: ${{ vars.OPENAPI_SERVER_URL }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          CATALOGO_API_KEY: ${{ secrets.CATALOGO_API_KEY }}
          DEPLOY_REVISION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/deploy-k8s.py
